schema = 2
id = "ubuntu-live-aarch64"
status = "runtime"
extends = "ubuntu-e2e.toml"
aliases = ["ubuntu-live"]

[boot]
command_line = "console=hvc0 quiet loglevel=3 boot=casper noprompt systemd.show_status=false systemd.unit=console-getty.service panic=-1"
media_initrd_path = "casper/initrd"

[host.build]
bootargs = "console=hvc0 quiet loglevel=3 boot=casper noprompt systemd.show_status=false systemd.unit=console-getty.service systemd.wants=systemd-user-sessions.service systemd.mask=ldconfig.service systemd.mask=systemd-udev-trigger.service systemd.mask=systemd-resolved.service systemd.mask=netplan-configure.service panic=-1"

[artifacts.initrd]
source = "ubuntu:26.04-live-server-arm64.iso:/casper/initrd"
cache = "build/guest-images/ubuntu-26.04-aarch64-live-initrd"
sha256 = "58398d8db91bd5649be79ea12eca1201034af7a04ec3cad136b71bc8a29be31a"
max_bytes = 268435456

[artifacts.dtb]
sha256 = "eb6f1cd470687badf9988baa0210a56319f6ccce0f740078cf7a63740f457d8e"

[placements.default]
ram_size = 0x40000000
dtb_load_address = 0x7f000000

[placements.dual-primary]
ram_size = 0x40000000
dtb_load_address = 0x7f000000
dtb_sha256 = "eb6f1cd470687badf9988baa0210a56319f6ccce0f740078cf7a63740f457d8e"

[host.qemu]
memory = "3G"

[host.console]
adapter = "expect"
success = ["$ "]
require = ["Ubuntu 26.04", "ubuntu@"]
reject = ["Initramfs unpacking failed", "emergency mode", "Emergency Shell", "Press Enter for maintenance"]
probe_line = "printf 'agentos-live-%s\\n' proof && sudo -n ip link set eth0 up && { ping -6 -c1 -W1 ff02::1%eth0 >/dev/null 2>&1 || true; } && printf 'agentos-live-net-%s\\n' proof"
probe_marker = "agentos-live-net-proof"
probe_timeout_secs = 180

[[host.console.interaction]]
when = ["login:"]
send = "ubuntu\r"
max_fires = 5

[[host.console.interaction]]
when = ["Password:"]
send = "\r"
max_fires = 5

[[host.test]]
action = "wait-console"
args = { marker = "$ " }

[[host.test]]
action = "assert-virtio"
args = { devices = "net,block,console", scope = "host-backed", console_io = "bidirectional" }

[[host.test]]
action = "wait-ssh"
args = { account = "ubuntu", marker = "Linux" }
