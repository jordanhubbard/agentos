schema = 2
id = "ubuntu-live-aarch64"
status = "runtime"
extends = "ubuntu-e2e.toml"
aliases = ["ubuntu-live"]

[boot]
command_line = "console=hvc0 quiet loglevel=3 boot=casper noprompt systemd.show_status=false systemd.unit=emergency.target panic=-1"
media_initrd_path = "casper/initrd"

[host.build]
bootargs = "console=hvc0 quiet loglevel=3 boot=casper noprompt systemd.show_status=false systemd.unit=emergency.target panic=-1"
initrd_total_bytes = 147480436
media_initrd_cache = "build/guest-images/ubuntu-26.04-aarch64-live-initrd.base"

[artifacts.initrd]
source = "generated:ubuntu-casper-profile-overlay"
cache = "build/guest-images/ubuntu-26.04-aarch64-live-initrd.overlay"
sha256 = "8fef5cbdde399017c9cbe815f0858200c3a1270c60923543dba17a1b1fcaf530"
max_bytes = 268435456

[artifacts.dtb]
sha256 = "0d5ab4de5edc09e24b0d2fdf815610d65de99c6b32749d30282eacfb584cffa0"

[placements.default]
ram_size = 0x40000000
dtb_load_address = 0x7f000000

[placements.dual-primary]
ram_size = 0x40000000
dtb_load_address = 0x7f000000
dtb_sha256 = "0d5ab4de5edc09e24b0d2fdf815610d65de99c6b32749d30282eacfb584cffa0"

[host.qemu]
memory = "3G"

[host.desktop]
adapter = "rfb-over-ssh"
local_port = 15901
guest_socket = "/tmp/agentos-vnc.sock"
provision_timeout_secs = 1200
frame_timeout_secs = 600
io_timeout_secs = 180
provision_script = '''set -eu
TIGERVNC_DEB=/tmp/tigervnc-standalone-server.deb
TIGERVNC_SHA256=30e536f05a504ad817b294abee51394143e140c57e4b4cea43c149973cfba3b2
fetch_tigervnc_deb() {
    output=$1
    package=$2
    for mirror in http://archive.ubuntu.com/ubuntu http://ports.ubuntu.com/ubuntu-ports; do
        for attempt in 1 2; do
            rm -f "$output"
            printf 'fetching %s from %s (attempt %s)\n' "$package" "$mirror" "$attempt"
            if timeout 60 wget -nv -O "$output" "$mirror/pool/universe/t/tigervnc/$package"; then
                return 0
            fi
        done
    done
    return 1
}
if ! command -v Xtigervnc >/dev/null 2>&1; then
    TIGERVNC_COMMON_DEB=/tmp/tigervnc-common.deb
    TIGERVNC_COMMON_SHA256=ee669c6253bde0b9f7b43c270607d560ea27285e88ba7dc379338e1cf91c3d1e
    fetch_tigervnc_deb "$TIGERVNC_COMMON_DEB" tigervnc-common_1.15.0+dfsg-2build1_arm64.deb
    printf '%s  %s\n' "$TIGERVNC_COMMON_SHA256" "$TIGERVNC_COMMON_DEB" | sha256sum -c -
    fetch_tigervnc_deb "$TIGERVNC_DEB" tigervnc-standalone-server_1.15.0+dfsg-2build1_arm64.deb
    printf '%s  %s\n' "$TIGERVNC_SHA256" "$TIGERVNC_DEB" | sha256sum -c -
    dpkg-deb -x "$TIGERVNC_COMMON_DEB" /
    dpkg-deb -x "$TIGERVNC_DEB" /
fi
command -v Xtigervnc >/dev/null
command -v gnome-calculator >/dev/null
printf 'agentos-desktop-binaries-ready\n'
install -d -o ubuntu -g ubuntu /home/ubuntu/.vnc
install -d -m 1777 /tmp/.X11-unix
rm -f /tmp/.X1-lock /tmp/.X11-unix/X1 /tmp/agentos-vnc.sock /tmp/agentos-desktop.pid
setsid -f su -s /bin/sh ubuntu -c 'exec env HOME=/home/ubuntu USER=ubuntu Xtigervnc :1 -rfbport -1 -rfbunixpath /tmp/agentos-vnc.sock -rfbunixmode 0600 -rendernode "" -ac -SecurityTypes None -geometry 1024x768 -depth 24' </dev/null >/tmp/agentos-xvnc.log 2>&1
attempt=0
while test "$attempt" -lt 120; do
    test -S /tmp/.X11-unix/X1 && test -S /tmp/agentos-vnc.sock && break
    attempt=$((attempt + 1))
    sleep 1
done
if ! test -S /tmp/.X11-unix/X1 || ! test -S /tmp/agentos-vnc.sock; then
    cat /tmp/agentos-xvnc.log >&2
    exit 1
fi
printf 'agentos-desktop-rfb-listener-ready\n'
su -s /bin/sh ubuntu -c 'env HOME=/home/ubuntu USER=ubuntu DISPLAY=:1 dbus-run-session -- gnome-calculator >/tmp/agentos-desktop.log 2>&1 & echo $! >/tmp/agentos-desktop.pid'
attempt=0
while test "$attempt" -lt 120; do
    if pgrep -x Xtigervnc >/dev/null &&
       test -S /tmp/.X11-unix/X1 &&
       test -S /tmp/agentos-vnc.sock &&
       test -s /tmp/agentos-desktop.pid &&
       kill -0 "$(cat /tmp/agentos-desktop.pid)" 2>/dev/null; then
        printf 'agentos-desktop-app-ready\n'
        break
    fi
    attempt=$((attempt + 1))
    sleep 1
done
if ! pgrep -x Xtigervnc >/dev/null ||
   ! test -S /tmp/.X11-unix/X1 ||
   ! test -S /tmp/agentos-vnc.sock ||
   ! test -s /tmp/agentos-desktop.pid ||
   ! kill -0 "$(cat /tmp/agentos-desktop.pid)" 2>/dev/null; then
    cat /tmp/agentos-xvnc.log /tmp/agentos-desktop.log >&2
    exit 1
fi
printf 'agentos-desktop-local-rfb-ready\n'
'''

[host.console]
adapter = "expect"
success = ["# "]
require = ["agentos-casper-console-hook"]
reject = ["Initramfs unpacking failed", "emergency mode", "Emergency Shell", "Press Enter for maintenance"]
probe_line = "printf 'agentos-live-%s\\n' proof && sudo -n ip link set eth0 up && { ping -6 -c1 -W1 ff02::1%eth0 >/dev/null 2>&1 || true; } && printf 'agentos-live-net-%s\\n' proof"
probe_marker = "agentos-live-net-proof"
probe_timeout_secs = 180

[[host.console.interaction]]
when = ["login:"]
send = "ubuntu\r"
max_fires = 5

[[host.console.interaction]]
when = ["Password:"]
send = "\r"
max_fires = 5

[[host.test]]
action = "wait-console"
args = { marker = "# " }

[[host.test]]
action = "assert-virtio"
args = { devices = "net,block,console", scope = "host-backed", console_io = "bidirectional" }

[[host.test]]
action = "wait-ssh"
args = { account = "ubuntu", marker = "Linux" }

[[host.acquire]]
action = "stage-url"
args = { cache_name = "ubuntu-26.04-desktop-arm64.iso", output = "ubuntu-26.04-aarch64.iso", url = "https://cdimage.ubuntu.com/releases/26.04/release/ubuntu-26.04-desktop-arm64.iso" }

[[host.acquire]]
action = "extract-iso-file"
args = { source = "ubuntu-26.04-aarch64.iso", member = "casper/initrd", output = "ubuntu-26.04-aarch64-live-initrd.base", min_bytes = "1048576" }

[[host.acquire]]
action = "build-initramfs-file"
args = { output = "ubuntu-26.04-aarch64-live-initrd.overlay", path = "scripts/casper-bottom/25configure_init", mode = "0755", compression = "zstd", content = "#!/bin/sh\nPREREQ=\"\"\nprereqs() { echo \"$PREREQ\"; }\ncase \"${1:-}\" in prereqs) prereqs; exit 0 ;; esac\nmount -t proc proc /root/proc 2>/dev/null || true\nmount -t sysfs sysfs /root/sys 2>/dev/null || true\necho agentos-casper-console-hook >/dev/console\nexec chroot /root /bin/sh -i </dev/console >/dev/console 2>&1\n" }

[[host.acquire]]
action = "extract-arm64-linux-image"
args = { source = "ubuntu-26.04-aarch64.iso", member = "casper/vmlinuz", output = "ubuntu-26.04-aarch64-Image" }
