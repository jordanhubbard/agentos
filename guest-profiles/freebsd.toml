schema = 2
id = "freebsd-15-aarch64"
status = "runtime"
aliases = ["freebsd"]

[target]
architecture = "aarch64"
boot_protocol = "fdt-direct"
kernel_format = "raw"
control_type = 2
guest_id = 1
vcpus = 1
devices = ["net", "block", "console"]
network_client = 1
block_media = 1
autostart = true
entry_from_image = false

[boot]
command_line = "FreeBSD:vfs.root.mountfrom=cd9660:/dev/iso9660/15_0_RELEASE_AARCH64_DVD -s console=ttyu0 boot_serial=YES"

[artifacts.kernel]
source = "freebsd:15.0-RELEASE-arm64-aarch64-disc1.iso:/boot/kernel/kernel"
cache = "build/guest-images/freebsd-15.0-aarch64-kernel"
sha256 = "d9878f095ce43d2bd0b0c75ae3085f67ecc74ec9f6e58a0d8c3e4fa29630f597"
max_bytes = 134217728

[artifacts.dtb]
source = "generated:freebsd-direct.dts"
cache = "build/qemu_virt_aarch64/freebsd-direct.dtb"
sha256 = "87f3626cf198e457da0d51b3b8bc356fe902704437cb1b33f2bd043d5cbb781e"
max_bytes = 1048576

[placements.default]
guest_gpa_base = 0x40000000
vmm_hva_base = 0x80000000
ram_size = 0x20000000
kernel_load_address = 0x40000000
kernel_entry_address = 0x40000000
dtb_load_address = 0x5f000000

[placements.dual-secondary]
guest_gpa_base = 0x40000000
vmm_hva_base = 0x80000000
ram_size = 0x10000000
kernel_load_address = 0x40000000
kernel_entry_address = 0x40000000
dtb_load_address = 0x4f000000
dtb_sha256 = "c81a2082156f52c3f2ceeaf57578fac62978cf75bde5fb7308e286dca39de4a4"

[host.qemu]
board = "qemu_virt_aarch64"
machine = "virt,virtualization=on,highmem=off,secure=off,acpi=off"
memory = "2G"

[[host.qemu.media]]
path = "build/guest-images/freebsd-15.0-aarch64.iso"
drive_id = "secondary_media"
bus = 31
override_env = ["AGENTOS_FREEBSD_IMAGE", "FREEBSD_IMAGE"]

[host.qemu.ssh]
account = "root"
host_port = 12223
guest_address = "10.0.2.16"

[host.console]
adapter = "expect"
success = ["root@:~ # ", "\n# ", "\r# "]
reject = ["mountroot>", "Manual root filesystem specification"]
probe_line = "printf 'agentos-console-%s\\n' proof"
probe_marker = "agentos-console-proof"

[[host.console.interaction]]
when = ["Console type [vt100]:"]
send = "\r"

[[host.console.interaction]]
when = ["begin an installation or use the live"]
send = "\t\r"

[[host.console.interaction]]
when = ["Enter full pathname of shell", "Unsupported version"]
send = "/rescue/sh\r"

[[host.console.interaction]]
when = ["Enter full pathname of shell", "ld-elf.so.1:"]
send = "/rescue/sh\r"

[[host.console.interaction]]
when = ["Enter full pathname of shell"]
send = "\n"

[[host.console.interaction]]
when = ["login:"]
send = "root\r"
max_fires = 4

[[host.console.interaction]]
when = ["Password:"]
send = "\r"
max_fires = 4

[host.build]
adapter = "fdt-template"
template = "kernel/agentos-root-task/freebsd-direct.dts"
acquire_dir = "build/guest-images"

[[host.acquire]]
action = "stage-url"
args = { cache_name = "FreeBSD-15.0-RELEASE-arm64-aarch64-dvd1.iso", output = "freebsd-15.0-aarch64.iso", url = "https://download.freebsd.org/releases/arm64/aarch64/ISO-IMAGES/15.0/FreeBSD-15.0-RELEASE-arm64-aarch64-dvd1.iso", override_env = "AGENTOS_FREEBSD_IMAGE,FREEBSD_IMAGE" }

[[host.acquire]]
action = "extract-arm64-elf-image"
args = { source = "freebsd-15.0-aarch64.iso", member = "boot/kernel/kernel", output = "freebsd-15.0-aarch64-kernel" }

[[host.provision]]
action = "send-console"
args = { text = "mkdir -p /tmp/agentos-ssh 2>/dev/null || { mount -t tmpfs tmpfs /tmp && mkdir -p /tmp/agentos-ssh; }" }

[[host.provision]]
action = "send-console"
args = { text = "rm -f /tmp/agentos-ssh/host_key /tmp/agentos-ssh/host_key.pub /tmp/agentos-ssh/sshd.pid && printf '%s\\n' '{{ssh_public_key}}' > /tmp/agentos-ssh/authorized_keys && chmod 600 /tmp/agentos-ssh/authorized_keys" }

[[host.provision]]
action = "send-console"
args = { text = "ifconfig vtnet0 inet 10.0.2.16 netmask 255.255.255.0 up && ( route delete default >/dev/null 2>&1 || true ) && ( route add default 10.0.2.2 >/dev/null 2>&1 || true )" }

[[host.provision]]
action = "send-console"
args = { text = "ssh-keygen -q -t ed25519 -N '' -f /tmp/agentos-ssh/host_key" }

[[host.provision]]
action = "send-console"
args = { text = "/usr/sbin/sshd -t -f /dev/null -o HostKey=/tmp/agentos-ssh/host_key -o AuthorizedKeysFile=/tmp/agentos-ssh/authorized_keys -o StrictModes=no -o PermitRootLogin=yes -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no -o PubkeyAuthentication=yes -o UsePAM=no -o PidFile=/tmp/agentos-ssh/sshd.pid" }

[[host.provision]]
action = "send-console"
args = { text = "/usr/sbin/sshd -f /dev/null -o HostKey=/tmp/agentos-ssh/host_key -o AuthorizedKeysFile=/tmp/agentos-ssh/authorized_keys -o StrictModes=no -o PermitRootLogin=yes -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no -o PubkeyAuthentication=yes -o UsePAM=no -o PidFile=/tmp/agentos-ssh/sshd.pid" }

[[host.test]]
action = "wait-console"
args = { marker = "# " }

[[host.test]]
action = "wait-ssh"
args = { account = "root", marker = "FreeBSD" }

[[host.test]]
action = "assert-virtio"
args = { devices = "net,block", scope = "host-backed" }
