schema = 1
id = "ubuntu-e2e-aarch64"
status = "runtime"
extends = "linux-base.toml"

[boot]
command_line = "console=hvc0 quiet loglevel=3 rdinit=/init panic=-1 ip=dhcp"

[artifacts.kernel]
source = "ubuntu:26.04-live-server-arm64.iso:/casper/vmlinuz"
cache = "build/guest-images/ubuntu-26.04-aarch64-Image"
sha256 = "94e37ccd7694d894e0d21f3f7c2e964046c77ce1c9208e11aa62fc98eb621696"

[artifacts.dtb]
source = "generated:linux.dts+ubuntu-iso-overlay.dts.in"
cache = "build/qemu_virt_aarch64/vm.dtb"
sha256 = "e759bfa8eaee0f4c10ad9c1849f5ec2b9f38423c3db2d563ffd2400824136272"

[artifacts.initrd]
source = "generated:ubuntu-e2e-initramfs"
cache = "build/guest-images/ubuntu-26.04-aarch64-initrd"
sha256 = "d1cf143640f94d084995e2d4e21bdff58360e682bb4a18c0da1dd56b43674ff7"

[placements.dual-primary]
dtb_sha256 = "e759bfa8eaee0f4c10ad9c1849f5ec2b9f38423c3db2d563ffd2400824136272"

[[host.acquire]]
action = "download"
args = { artifact = "installer-iso" }

[[host.acquire]]
action = "extract-iso-file"
args = { member = "casper/vmlinuz", artifact = "kernel" }

[[host.acquire]]
action = "build-initramfs"
args = { recipe = "ubuntu-e2e", artifact = "initrd" }

[[host.test]]
action = "wait-console"
args = { marker = "agentos-ubuntu-ready" }

[[host.test]]
action = "assert-virtio"
args = { devices = "net,block,console" }
