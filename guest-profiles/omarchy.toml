schema = 2
id = "omarchy-x86-64"
status = "planned"
extends = "arch.toml"
aliases = ["omarchy"]

[target]
architecture = "x86-64"
boot_protocol = "uefi"
kernel_format = "uefi"
devices = ["net", "block", "console", "gpu", "input", "sound"]
entry_from_image = false

[boot]
command_line = "root=/dev/vda1 rw"

[placements.default]
kernel_entry_address = 0x40000000

[placements.dual-primary]
kernel_entry_address = 0x40000000

[host.qemu]
board = "x86_64_generic"
machine = "q35"
memory = "2G"

[host.build]
adapter = "uefi-artifacts"
acquire_dir = "_build/guest-images/omarchy-4.0.4"

# Artifact qualification is deliberately available while this profile remains
# planned.  The guest-profile tool permits planned profiles to stage only
# hash-pinned upstream media; it still rejects host execution and target-image
# admission until the installation path is qualified and status becomes runtime.
[[host.acquire]]
action = "stage-url"
args = { cache_name = "omarchy-4.0.4.iso", output = "omarchy-4.0.4.iso", url = "https://iso.omarchy.org/omarchy-4.0.4.iso", override_env = "AGENTOS_OMARCHY_ISO", sha256 = "ddeded2758c48318d201dfdac905ecb28f570441883f0c052ea3cd5d05acf92d" }

[[host.provision]]
action = "run-ssh"
args = { recipe = "omarchy-wayland" }

[[host.test]]
action = "assert-virtio"
args = { devices = "net,block,console,gpu,input,sound", scope = "host-backed", console_io = "bidirectional" }
