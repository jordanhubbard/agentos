schema = 1
id = "omarchy-x86-64"
status = "planned"
extends = "arch.toml"

[target]
architecture = "x86-64"
boot_protocol = "uefi"
kernel_format = "uefi"
devices = ["net", "block", "console", "gpu", "input", "sound"]
entry_from_image = false

[boot]
command_line = "root=/dev/vda1 rw"

[placements.default]
kernel_entry_address = 0x40000000

[placements.dual-primary]
kernel_entry_address = 0x40000000

[[host.provision]]
action = "run-ssh"
args = { recipe = "omarchy-wayland" }

[[host.test]]
action = "assert-virtio"
args = { devices = "net,block,console,gpu,input,sound" }
