schema = 2
id = "debian-graphics-input-aarch64"
status = "runtime"
extends = "debian-gpu.toml"
aliases = ["debian-graphics-input"]

[target]
devices = ["net", "block", "console", "gpu", "input"]

[artifacts.dtb]
source = "generated:linux.dts+profile-selected-virtio-gpu+virtio-input"
cache = "build/qemu_virt_aarch64/debian-graphics-input-vm.dtb"
sha256 = "95d736516c68684f0ea7e1ea975eaff3ff47468e78e965873fcad20df34cab2e"

[placements.dual-primary]
dtb_sha256 = "95d736516c68684f0ea7e1ea975eaff3ff47468e78e965873fcad20df34cab2e"

[host.qemu.ssh]
host_port = 12235

[host.console]
probe_line = "modprobe virtio_input && modprobe virtio_gpu && test -e /dev/dri/card0 && test -c /dev/fb0 && printf '\\021\\042\\063\\000\\104\\125\\146\\000' | dd of=/dev/fb0 bs=1 seek=819200 conv=notrunc status=none && sleep 1 && printf 'agentos-debian-graphics-input-%s\\n' ready"
probe_marker = "agentos-debian-graphics-input-ready"
probe_timeout_secs = 180
