# agentOS system descriptor (TOML)
# Consumed by: cargo xtask gen-pd-bundle / gen-image
#
# This file lists the Protection Domains bundled into the default agentOS
# image.  Each PD ELF must exist as <name>.elf in the build output directory.
#
# The root task spawns exactly the PDs named in
# src/system_desc_<arch>.c; a PD listed here but absent from that descriptor
# is dead weight in the image and is never started.  Keep this list equal to
# the aarch64 descriptor's PD set.  The Makefile appends guest_vmm_secondary,
# fault_inject, and test_runner for the image variants that spawn them, and
# rewrites the guest_vmm_primary line for secondary-only images, so that
# line must stay byte-identical.
#
# Museum PDs (docs/TCB.md) are still built by the root-task Makefile IMAGES
# list but are no longer bundled or booted (MAC
# task_56eae59d9aa94d2d9d047f03fc9d22ad).
#
# Priority values are recorded in the image header for documentation parity;
# actual scheduling priorities are the descriptor's and are enforced by the
# root task at boot.
#
# Arch-specific overrides live in boards/<board-name>/agentos.toml.

# ── Foundation: nameserver, logging, UART ────────────────────────────────────

[[pd]]
name = "nameserver"
priority = 170

[[pd]]
name = "log_drain"
priority = 160

[[pd]]
name = "serial_pd"
priority = 100

# ── Control plane: event_bus, controller, init_agent ─────────────────────────
# controller prints "agentOS boot complete" (the GUEST_OS=none harness marker)
# and registers the device services with the nameserver.

[[pd]]
name = "event_bus"
priority = 200

[[pd]]
name = "controller"
priority = 50

[[pd]]
name = "init_agent"
priority = 100

# ── Services the controller / cc_pd still resolve at boot ────────────────────
# vibe_engine sits in the cc_pd guest-control relay path (dynamic guest list,
# lifecycle, console); the source lint asserts vm_manager > vibe_engine > cc_pd.

[[pd]]
name = "agentfs"
priority = 150

[[pd]]
name = "vibe_engine"
priority = 165

[[pd]]
name = "vfs_server"
priority = 155

[[pd]]
name = "net_server"
priority = 160

# ── Device-owning driver PDs (docs/TCB.md "TCB today") ───────────────────────

[[pd]]
name = "virtio_blk"
priority = 175

[[pd]]
name = "block_pd"
priority = 165

[[pd]]
name = "net_pd"
priority = 160

[[pd]]
name = "framebuffer_pd"
priority = 175

[[pd]]
name = "usb_pd"
priority = 165

# ── Guest execution and control ──────────────────────────────────────────────

[[pd]]
name = "guest_vmm_primary"
priority = 250

[[pd]]
name = "vm_manager"
priority = 170

[[pd]]
name = "cc_pd"
priority = 164

[[pd]]
name = "fault_handler"
priority = 255
