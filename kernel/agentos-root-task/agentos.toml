# agentOS system descriptor (TOML)
# Consumed by: cargo xtask gen-pd-bundle / gen-image
#
# This file lists the Protection Domains bundled into the default agentOS
# image.  Each PD ELF must exist as <name>.elf in the build output directory.
#
# The root task spawns exactly the PDs named in
# src/system_desc_<arch>.c; a PD listed here but absent from that descriptor
# is dead weight in the image and is never started.  Keep this list equal to
# the aarch64 descriptor's PD set.  The Makefile appends guest_vmm_secondary,
# fault_inject, and event_bus + test_runner for the image variants that spawn
# them, and rewrites the guest_vmm_primary line for secondary-only images, so
# that line must stay byte-identical.
#
# Museum PDs (docs/TCB.md) are still built by the root-task Makefile IMAGES
# list but are no longer bundled or booted (MAC
# task_56eae59d9aa94d2d9d047f03fc9d22ad).  The non-TCB service PDs that used
# to ride along (controller, event_bus, init_agent, agentfs, vfs_server,
# net_server, framebuffer_pd, usb_pd) were dropped by MAC
# task_f95d118416a24fa484c2c43f0d955b56; cc_pd now prints the
# "agentOS boot complete" harness marker.
#
# Priority values are recorded in the image header for documentation parity;
# actual scheduling priorities are the descriptor's and are enforced by the
# root task at boot.
#
# Arch-specific overrides live in boards/<board-name>/agentos.toml.

# ── Foundation: nameserver, logging, UART ────────────────────────────────────

[[pd]]
name = "nameserver"
priority = 170

[[pd]]
name = "log_drain"
priority = 160

[[pd]]
name = "serial_pd"
priority = 100

# ── Dynamic-guest relay (not TCB) ────────────────────────────────────────────
# vibe_engine sits in the cc_pd guest-control relay path (MSG_CC_CREATE_GUEST,
# dynamic guest list/lifecycle/console) and is the hop that reaches vm_manager;
# the source lint asserts vm_manager > vibe_engine > cc_pd.

[[pd]]
name = "vibe_engine"
priority = 165

# ── Device-owning driver PDs (docs/TCB.md "TCB today") ───────────────────────

[[pd]]
name = "virtio_blk"
priority = 175

[[pd]]
name = "block_pd"
priority = 165

[[pd]]
name = "net_pd"
priority = 160

# ── Virtualizer PDs (docs/TCB.md "TCB target": the only mux per class) ───────
# net_virt owns no device frame or IRQ; it moves frames between the guest
# sDDF queues and net_pd.  The descriptor keeps it just below net_pd (207),
# which it calls into.

[[pd]]
name = "net_virt"
priority = 205

# blk_virt owns no device frame or IRQ; it moves block requests between the
# guest sDDF queues in the shared block region and virtio_blk.  The
# descriptor keeps it just below virtio_blk (215) / block_pd (213).

[[pd]]
name = "blk_virt"
priority = 210

# ── Guest execution and control ──────────────────────────────────────────────

[[pd]]
name = "guest_vmm_primary"
priority = 250

[[pd]]
name = "vm_manager"
priority = 170

[[pd]]
name = "cc_pd"
priority = 164

[[pd]]
name = "fault_handler"
priority = 255
