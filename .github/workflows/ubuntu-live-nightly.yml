name: Guest live-media qualification

# The full Casper live-filesystem proof boots Ubuntu's real initrd and ISO
# through agentOS-emulated virtio net, blk, and console.  Under TCG on a hosted
# x86 runner it takes up to two hours, so it is a release qualification that
# runs nightly and on demand, not a per-push gate (ci.yml).  Release evidence
# cites this workflow's retained artifact.
# Debian additionally proves a persistent witness across two cold boots.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  SEL4_SDK: /tmp/microkit-sdk-2.1.0

jobs:
  ubuntu-live:
    name: Guest qualification (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: test-ubuntu-live
            artifact: ubuntu-live-qualification-logs
            media: ubuntu
            timeout: 150
          - target: test-native-with-guest
            artifact: native-ubuntu-live-qualification-logs
            media: ubuntu
            timeout: 150
          - target: test-debian-persistence
            artifact: debian-persistent-boot-proof
            media: debian
            timeout: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang / lld / QEMU / dtc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang lld llvm \
            qemu-system-arm qemu-utils \
            device-tree-compiler \
            libarchive-tools e2fsprogs \
            curl

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-none
      - uses: Swatinem/rust-cache@v2

      - name: Cache Microkit SDK
        id: cache-sdk-ubuntu-live
        uses: actions/cache@v4
        with:
          path: ${{ env.SEL4_SDK }}
          key: microkit-sdk-2.1.0-linux-x86-64

      - name: Download Microkit SDK
        if: steps.cache-sdk-ubuntu-live.outputs.cache-hit != 'true'
        run: |
          curl -fsSL \
            https://github.com/seL4/microkit/releases/download/2.1.0/microkit-sdk-2.1.0-linux-x86-64.tar.gz \
            -o /tmp/microkit-sdk.tar.gz
          mkdir -p "$(dirname "$SEL4_SDK")"
          tar -xzf /tmp/microkit-sdk.tar.gz -C "$(dirname "$SEL4_SDK")"
          rm /tmp/microkit-sdk.tar.gz

      - name: Cache Ubuntu ISO
        if: matrix.media == 'ubuntu'
        uses: actions/cache@v4
        with:
          path: ~/.cache/agentos/isos/ubuntu-26.04-desktop-arm64.iso
          key: ubuntu-26.04-desktop-arm64-iso

      - name: Cache pinned Debian image and manifest
        if: matrix.media == 'debian'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/agentos/isos/debian-13-generic-arm64-20260831-2587.qcow2
            ~/.cache/agentos/isos/debian-13-20260831-2587-SHA512SUMS
          key: *************************************

      - name: Prove guest userspace on agentOS VirtIO
        # TCG throughput varies substantially across hosted runners.  Keep the
        # assertion deadline aligned with the release/demo proof and leave an
        # outer envelope for the build plus evidence upload.
        # Persistence runs two complete boots; it needs two assertion windows.
        timeout-minutes: ${{ matrix.timeout }}
        run: make ${{ matrix.target }} QEMU_TEST_TIMEOUT=7200

      - name: Upload QEMU serial logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            build/tmp/agentos-qemu-*.log
            build/tmp/agentos-qemu-*.qemu.stderr
            build/tmp/agentos-qemu-*.net.pcap
            build/tmp/agentos-qemu-*.boot-timing.json
            build/qemu_virt_aarch64/agentos.img
            build/evidence/persistent-boot-*/
          if-no-files-found: ignore
