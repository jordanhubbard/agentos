name: Pinned SDK candidate

on:
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  sdk:
    name: Rebuild and package qualified SDK kernels
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build python3-venv libxml2-utils \
            gcc-13-aarch64-linux-gnu gcc-13-x86-64-linux-gnu \
            binutils-aarch64-linux-gnu binutils-x86-64-linux-gnu curl \
            gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf \
            qemu-system-arm qemu-system-misc ipxe-qemu device-tree-compiler
          mkdir -p "$RUNNER_TEMP/sdk-toolchain"
          ln -s /usr/bin/aarch64-linux-gnu-gcc-13 "$RUNNER_TEMP/sdk-toolchain/aarch64-linux-gnu-gcc"
          ln -s /usr/bin/x86_64-linux-gnu-gcc-13 "$RUNNER_TEMP/sdk-toolchain/x86_64-linux-gnu-gcc"
          ln -s /usr/bin/aarch64-linux-gnu-cpp-13 "$RUNNER_TEMP/sdk-toolchain/aarch64-linux-gnu-cpp"
          ln -s /usr/bin/x86_64-linux-gnu-cpp-13 "$RUNNER_TEMP/sdk-toolchain/x86_64-linux-gnu-cpp"
          echo "$RUNNER_TEMP/sdk-toolchain" >> "$GITHUB_PATH"
          python3 -m venv "$RUNNER_TEMP/sdk-venv"
          "$RUNNER_TEMP/sdk-venv/bin/pip" install -r tools/sdk/python-requirements.txt
          echo "$RUNNER_TEMP/sdk-venv/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned upstream sources
        run: |
          git init "$RUNNER_TEMP/microkit-source"
          git -C "$RUNNER_TEMP/microkit-source" fetch --depth=1 https://github.com/seL4/microkit.git ec86afdcd662b5976d11d4994acf1b11a2979882
          git -C "$RUNNER_TEMP/microkit-source" checkout --detach FETCH_HEAD
          git init "$RUNNER_TEMP/sel4-source"
          git -C "$RUNNER_TEMP/sel4-source" fetch --depth=1 https://github.com/seL4/seL4.git e60776acc31097ca063806c257f07a3ec05eacf8
          git -C "$RUNNER_TEMP/sel4-source" checkout --detach FETCH_HEAD
      - name: Rebuild and check kernel and Multiboot hashes
        run: |
          mkdir -p _build/sdk-evidence
          aarch64-linux-gnu-gcc --version > _build/sdk-evidence/toolchain.txt
          x86_64-linux-gnu-gcc --version >> _build/sdk-evidence/toolchain.txt
          riscv64-unknown-elf-gcc --version >> _build/sdk-evidence/toolchain.txt
          "$RUNNER_TEMP/sdk-venv/bin/pip" freeze > _build/sdk-evidence/python-requirements.txt
          make sdk-candidate GUEST_OS=none \
            SDK_CANDIDATE_MICROKIT_SOURCE="$RUNNER_TEMP/microkit-source" \
            SDK_CANDIDATE_SEL4_SOURCE="$RUNNER_TEMP/sel4-source" \
            SDK_CANDIDATE_PYTHON="$RUNNER_TEMP/sdk-venv/bin/python" \
            SDK_CANDIDATE_DIR="$GITHUB_WORKSPACE/_build/sdk-candidate" 2>&1 | tee _build/sdk-evidence/build.log
      - name: Package and verify installation
        run: |
          make sdk-candidate-package GUEST_OS=none \
            SEL4_SDK="$GITHUB_WORKSPACE/_build/sdk-candidate/microkit/release/microkit-sdk-2.3.1-agentos-e60776ac-cr2" \
            SDK_CANDIDATE_MICROKIT_SOURCE="$RUNNER_TEMP/microkit-source" \
            SDK_CANDIDATE_SEL4_SOURCE="$RUNNER_TEMP/sel4-source" 2>&1 | tee _build/sdk-evidence/package.log
          # Install the archive this run just built and verify it against the
          # digest this run just computed. That is a packaging-integrity check
          # of the artifact in hand.
          #
          # It deliberately does NOT reuse SDK_CANDIDATE_ARCHIVE_SHA256, which
          # names the asset `make sdk` downloads from the release today. While a
          # board is being added, the two necessarily differ, and asserting they
          # are equal here would fail a build that is behaving correctly. The
          # comparison against the published pin is made explicitly by
          # sdk-candidate-package above, which prints both digests and emits a
          # ::warning:: naming the republication step when they diverge.
          built_sha="$(sha256sum _build/sdk-candidate-package/agentos-sdk-targets.tar.gz | cut -d' ' -f1)"
          make sdk GUEST_OS=none SEL4_SDK_VERSION=2.3.1-agentos-e60776ac-cr2 \
            SEL4_SDK="$RUNNER_TEMP/sdk-installed" \
            SDK_CANDIDATE_ARCHIVE_SHA256="$built_sha" \
            MICROKIT_SDK_URL="file://$GITHUB_WORKSPACE/_build/sdk-candidate-package/agentos-sdk-targets.tar.gz" \
            2>&1 | tee _build/sdk-evidence/install.log
          # The installed SDK must carry every board the pipeline builds, or
          # packaging silently dropped one.
          for board in $(sed -n 's/^SDK_CANDIDATE_BOARDS := //p' tools/sdk/candidate.mk); do
            test -s "$RUNNER_TEMP/sdk-installed/board/$board/release/elf/sel4.elf" \
              || { echo "ERROR: installed SDK has no kernel for $board"; exit 1; }
            echo "installed: $board"
          done
          cd _build/sdk-candidate-package
          sha256sum -c SHA256SUMS
      - name: Retain distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sdk-candidate-${{ github.sha }}
          path: |
            _build/sdk-candidate-package/*.tar.gz
            _build/sdk-candidate-package/*.patch
            _build/sdk-candidate-package/*.sha256
            _build/sdk-candidate-package/*.mk
            _build/sdk-candidate-package/*.md
            _build/sdk-candidate-package/*.txt
            _build/sdk-candidate-package/*.c
            _build/sdk-candidate-package/SHA256SUMS
          if-no-files-found: error
      - name: Retain build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-build-evidence-${{ github.sha }}
          path: _build/sdk-evidence/
          if-no-files-found: warn
