name: agentOS CI

on:
  push:
    branches: [main, master]
  # Stacked changes use topic branches as temporary PR bases. Run the same
  # checks there instead of showing a misleading green PR with only external
  # security checks.
  pull_request: {}

# A newer revision supersedes only its own PR. Preserve every main/master push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # runner.* contexts are not available at workflow scope. GitHub-hosted
  # Ubuntu jobs are isolated, so a fixed temporary path is both valid here
  # and consistent with every SDK cache/download step below.
  SEL4_SDK_VERSION: 2.3.1-agentos-e60776ac-cr2
  SEL4_SDK: /tmp/microkit-sdk-2.3.1-agentos-e60776ac-cr2

defaults:
  run:
    shell: bash

jobs:
  sdk-candidate:
    uses: ./.github/workflows/sdk-candidate.yml
    permissions:
      contents: read
  # ---------------------------------------------------------------------------
  # Rust workspace tests (excludes WASM-only crates)
  # ---------------------------------------------------------------------------
  test:
    name: Cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install guest image and native helper tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y qemu-utils clang lld llvm
          qemu-img --version
          llvm-objcopy --version
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> _build/cargo"
      - name: Run tests
        run: cargo test --workspace --exclude health-monitor --exclude log-aggregator --exclude agentos-pd

  # ---------------------------------------------------------------------------
  # WASM agent example builds
  # ---------------------------------------------------------------------------
  build-examples:
    name: Build WASM examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> _build/cargo"
      - name: Build health-monitor
        working-directory: examples/health-monitor
        run: cargo build --release
      - name: Build log-aggregator
        working-directory: examples/log-aggregator
        run: cargo build --release


  # ---------------------------------------------------------------------------
  # Topology validation — fast gate, runs on all PRs touching topology or SDF
  # ---------------------------------------------------------------------------
  validate-topology:
    name: Validate topology.yaml + SDF
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> _build/cargo"

      - name: Validate topology.yaml
        run: cargo run -p gen-sdf -- tools/topology.yaml --validate-only

      - name: SDF diff (detect changes vs checked-in agentos.system)
        run: |
          mkdir -p _build/tmp
          cargo run -p gen-sdf -- tools/topology.yaml -o _build/tmp/agentos-generated.system
          if [ -f kernel/agentos-root-task/agentos.system ]; then
            echo "=== SDF diff (generated vs committed) ==="
            diff kernel/agentos-root-task/agentos.system _build/tmp/agentos-generated.system || true
          else
            echo "No committed agentos.system found — skipping diff"
          fi


  # ---------------------------------------------------------------------------
  # Guest I/O proof: emulated virtio-net packet through linux_vmm (not GUEST_OS=none)
  # ---------------------------------------------------------------------------
  guest-net-proof:
    name: Guest virtio-net packet proof (buildroot)
    runs-on: ubuntu-24.04
    needs: [validate-topology, sdk-candidate]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang / lld / QEMU / dtc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang lld llvm \
            qemu-system-arm \
            device-tree-compiler \
            libarchive-tools \
            curl

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> _build/cargo"

      - name: Install verified SDK artifact
        uses: ./.github/actions/install-sdk

      - name: Prove guest packet through emulated virtio-net
        timeout-minutes: 20
        run: make test-guest-net QEMU_TEST_TIMEOUT=480

      - name: Upload QEMU serial logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guest-net-proof-logs
          path: |
            _build/tmp/agentos-qemu-*.log
            _build/tmp/agentos-qemu-*.qemu.stderr
            _build/tmp/agentos-qemu-*.net.pcap
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Guest I/O proof: emulated virtio-blk request through linux_vmm (not GUEST_OS=none)
  # ---------------------------------------------------------------------------
  guest-blk-proof:
    name: Guest virtio-blk I/O proof (buildroot)
    runs-on: ubuntu-24.04
    needs: [validate-topology, sdk-candidate]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang / lld / QEMU / dtc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang lld llvm \
            qemu-system-arm \
            device-tree-compiler \
            libarchive-tools \
            curl

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> _build/cargo"

      - name: Install verified SDK artifact
        uses: ./.github/actions/install-sdk

      - name: Prove guest I/O through emulated virtio-blk
        timeout-minutes: 20
        run: make test-guest-blk QEMU_TEST_TIMEOUT=480

      - name: Prove VMM block mapping isolation with seL4 faults
        timeout-minutes: 30
        run: make test-block-isolation QEMU_TEST_TIMEOUT=120

      - name: Prove VMM network mapping isolation with seL4 faults
        timeout-minutes: 30
        run: make test-network-isolation QEMU_TEST_TIMEOUT=120

      - name: Reject spoofed virtualizer attachments through seL4 IPC
        timeout-minutes: 10
        run: make test-virtualizer-authority QEMU_TEST_TIMEOUT=120

      - name: Upload QEMU serial logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guest-blk-proof-logs
          path: |
            _build/tmp/agentos-qemu-*.log
            _build/tmp/agentos-qemu-*.qemu.stderr
            _build/tmp/agentos-qemu-*.net.pcap
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # End-state Ubuntu proof: no QEMU net/blk guest devices, agentOS VirtIO only
  # ---------------------------------------------------------------------------
  ubuntu-agentos-virtio-proof:
    name: Ubuntu agentOS VirtIO net + blk + console proof
    runs-on: ubuntu-24.04
    needs: [validate-topology, sdk-candidate]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang / lld / QEMU / dtc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang lld llvm \
            qemu-system-arm \
            device-tree-compiler \
            libarchive-tools \
            curl

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> _build/cargo"

      - name: Install verified SDK artifact
        uses: ./.github/actions/install-sdk

      - name: Cache Ubuntu ISO
        uses: actions/cache@v4
        with:
          path: ~/.cache/agentos/isos/ubuntu-26.04-desktop-arm64.iso
          key: ubuntu-26.04-desktop-arm64-iso

      - name: Prove Ubuntu uses agentOS VirtIO devices
        timeout-minutes: 30
        run: make test-ubuntu-virtio QEMU_TEST_TIMEOUT=480

      # The full Casper live-media proof (make test-ubuntu-live) takes up to
      # two hours under TCG on hosted runners and is a release qualification,
      # not a per-push check.  It runs in ubuntu-live-nightly.yml.

      - name: Upload QEMU serial logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-agentos-virtio-proof-logs
          path: |
            _build/tmp/agentos-qemu-*.log
            _build/tmp/agentos-qemu-*.qemu.stderr
            _build/tmp/agentos-qemu-*.net.pcap
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Phase 5 contract tests — run all PD contract test suites via xtask
  # Mirrors the build-and-test job structure; runs on qemu_virt_aarch64 only.
  # ---------------------------------------------------------------------------
  native-rust-proof:
    name: Native Rust PD runtime and network isolation proof
    runs-on: ubuntu-24.04
    needs: sdk-candidate
    # This serial suite builds distinct isolation images, including 16 framebuffer
    # modes. Allow a cold build to finish without adding more runner jobs.
    timeout-minutes: 40
    env:
      CCACHE_MAXSIZE: 512M
      # The root Makefile prepends LLVM_BIN for nested target builds.
      MAKEFLAGS: LLVM_BIN=/usr/lib/ccache
    steps:
      - uses: actions/checkout@v4
      - name: Install target build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang lld llvm qemu-system-arm device-tree-compiler curl ccache
          # Reuse identical compilations across probe modes within this job.
          # ccache still checks compiler options and preprocessed source.
          echo /usr/lib/ccache >> "$GITHUB_PATH"
          echo "CCACHE_DIR=$RUNNER_TEMP/native-proof-ccache" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-none
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> _build/cargo"
      - name: Install verified SDK artifact
        uses: ./.github/actions/install-sdk
      - name: Verify Rust IPC bridge and native target
        run: |
          mkdir -p _build/evidence/native-rust
          make test-rust-pd-abi 2>&1 | tee _build/evidence/native-rust/abi.log
          make test-native-rust QEMU_TEST_TIMEOUT=120 2>&1 | tee _build/evidence/native-rust/target.log
          cp _build/qemu_virt_aarch64/agentos.img _build/evidence/native-rust/runtime.img
          cp _build/qemu_virt_aarch64/native_rust_probe.elf _build/evidence/native-rust/
          cp _build/qemu_virt_aarch64/native_rust_client.elf _build/evidence/native-rust/
          make test-native-network-isolation QEMU_TEST_TIMEOUT=120 2>&1 | tee _build/evidence/native-rust/isolation.log
      - name: Retain native Rust proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-rust-proof
          path: |
            _build/evidence/native-rust/
            _build/evidence/native-network-isolation/
            _build/tmp/agentos-qemu-*
            _build/qemu_virt_aarch64/agentos.img
            _build/qemu_virt_aarch64/native_rust_probe.elf
            _build/qemu_virt_aarch64/native_rust_client.elf
      - name: Verify read-only boot inspection
        run: |
          mkdir -p _build/evidence/inspect
          make test-inspect QEMU_TEST_TIMEOUT=120 2>&1 | tee _build/evidence/inspect/report.log
          cp _build/qemu_virt_aarch64/agentos.img _build/evidence/inspect/report.img
          make test-inspect-readonly QEMU_TEST_TIMEOUT=120 2>&1 | tee _build/evidence/inspect/readonly.log
          cp _build/qemu_virt_aarch64/agentos.img _build/evidence/inspect/readonly.img
      - name: Retain inspection proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inspect-proof
          path: |
            _build/evidence/inspect/
            _build/tmp/agentos-qemu-*
          if-no-files-found: error

      - name: Verify operator serial session and isolation
        run: |
          mkdir -p _build/evidence/operator
          make test-operator-session QEMU_TEST_TIMEOUT=300 2>&1 | tee _build/evidence/operator/session.log
          cp _build/qemu_virt_aarch64/agentos.img _build/evidence/operator/session.img
          make test-operator-isolation QEMU_TEST_TIMEOUT=120 2>&1 | tee _build/evidence/operator/isolation.log
      - name: Retain operator proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operator-proof
          path: |
            _build/evidence/operator/
            _build/evidence/operator-isolation/
            _build/tmp/agentos-qemu-*
          if-no-files-found: error

      - name: Verify generic native logs and isolation
        run: |
          mkdir -p _build/evidence/log-native
          make test-log-rings QEMU_TEST_TIMEOUT=120 2>&1 | tee _build/evidence/log-native/output.log
          cp _build/qemu_virt_aarch64/agentos.img _build/evidence/log-native/output.img
          make test-log-isolation QEMU_TEST_TIMEOUT=120 2>&1 | tee _build/evidence/log-native/isolation.log
      - name: Retain native log proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-log-proof
          path: |
            _build/evidence/log-native/
            _build/evidence/log-isolation/
            _build/tmp/agentos-qemu-*
          if-no-files-found: error

      - name: Verify native framebuffer queues
        run: |
          mkdir -p _build/evidence/framebuffer
          make test-framebuffer QEMU_TEST_TIMEOUT=180 2>&1 | tee _build/evidence/framebuffer/target.log
          cp _build/qemu_virt_aarch64/agentos.img _build/evidence/framebuffer/agentos.img
          make test-framebuffer-isolation QEMU_TEST_TIMEOUT=180 2>&1 | tee _build/evidence/framebuffer/isolation.log
      - name: Retain framebuffer queue proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: framebuffer-queue-proof
          path: |
            _build/evidence/framebuffer/
            _build/evidence/framebuffer-isolation/
            _build/tmp/agentos-qemu-*
          if-no-files-found: error

      - name: Report native compiler cache usage
        if: always()
        run: ccache --show-stats

  contract-tests:
    name: Phase 5 contract tests (qemu_virt_aarch64)
    runs-on: ubuntu-24.04
    needs: [validate-topology, sdk-candidate]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang / lld / QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang lld llvm \
            qemu-system-arm \
            curl

      - name: Install verified SDK artifact
        uses: ./.github/actions/install-sdk

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> _build/cargo"

      - name: Build agentOS with IPC harness (CONFIG_IPC_HARNESS=1)
        run: |
          make build BOARD=qemu_virt_aarch64 CONFIG_IPC_HARNESS=1 GUEST_OS=none

      - name: Run contract tests
        run: |
          make test BOARD=qemu_virt_aarch64 GUEST_OS=none
        timeout-minutes: 5

      - name: Upload contract test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-tests-qemu_virt_aarch64
          path: _build/qemu_virt_aarch64/agentos.img
          if-no-files-found: ignore


  # ---------------------------------------------------------------------------
  # MANDATORY dual-arch OS-claim gate (agentos-46q)
  #
  # This job is the single, explicit gate that backs any OS-level "complete" /
  # "boot-proven" claim.  It runs BOTH required target/QEMU-backed commands in
  # one place so the requirement is unambiguous and can be made a required
  # status check in branch protection:
  #
  #     make test TARGET_ARCH=aarch64 GUEST_OS=none
  #     make test TARGET_ARCH=x86_64  GUEST_OS=none
  #
  # These are TARGET/QEMU tests (real seL4 image booted under QEMU), NOT the
  # host-only `make test-host` suite.  Per the PLAN priority rules, host-only
  # mocks may not be used as proof of production OS behavior — so if EITHER
  # arch fails, OS-level completion claims are blocked.
  # ---------------------------------------------------------------------------
  os-claim-gate:
    # Keep the protected check's established name. The aggregate OS-claim job
    # below adds stronger evidence without invalidating branch protection.
    name: Dual-arch OS-claim gate (aarch64 + x86_64, GUEST_OS=none)
    runs-on: ubuntu-24.04
    needs: [validate-topology, sdk-candidate]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang / lld / QEMU (both arches)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang lld llvm \
            qemu-system-arm qemu-system-x86 qemu-system-misc \
            curl

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> _build/cargo"

      - name: Install verified SDK artifact
        uses: ./.github/actions/install-sdk

      # TARGET/QEMU test #1 — aarch64.  Required for any OS-level claim.
      - name: GATE — make test TARGET_ARCH=aarch64 GUEST_OS=none
        timeout-minutes: 10
        run: make test TARGET_ARCH=aarch64 GUEST_OS=none

      # TARGET/QEMU test #2 — x86_64.  Required for any OS-level claim.
      #
      # This step asserts an EXACT PD count (X86_64_EXPECTED_PDS in
      # xtask/src/cmd_test.rs), not just "[rt] boot complete". Until that
      # changed it proved nothing at all: the whole x86_64 PD table lived
      # inside `#if defined(AGENTOS_X86_VTX)` and x86_64_generic is not a VTX
      # board, so the image started ZERO protection domains and still reached
      # the boot marker. This required check was green over an empty system.
      #
      # x86_64 GUEST support is NOT exercised here and is not exercised
      # anywhere in this file. It lives on the x86_64_generic_vtx board
      # (gate-x86_64-vtx / -firmware-reset / -linux-login) and needs a Linux
      # host with /dev/kvm and nested Intel VMX, which no runner here
      # provides. See docs/TCB.md, "x86_64 in CI: what is and is not proven".
      - name: GATE — make test TARGET_ARCH=x86_64 GUEST_OS=none (exact PD count)
        timeout-minutes: 10
        run: make test TARGET_ARCH=x86_64 GUEST_OS=none

      # The ONLY piece of x86_64's guest path that a normal CI runner can
      # execute, and until now it ran in no workflow at all:
      # `grep -rn test-x86-firmware-build .github/workflows/` returned zero
      # hits while the target sat in the Makefile being green on nobody's
      # machine.
      #
      # It LINKS the real VMX/EPT firmware VMM — guest_vmm_primary.elf, the
      # x86 runner, serial/block drivers, the block and network virtualizers,
      # the root task's MMIO dispatcher (rt_main.o built with
      # AGENTOS_X86_VTX=1 AGENTOS_X86_FIRMWARE_RESET=1), the host PCI probe
      # and the shared virtio-pci transport. It needs the SDK 2.3 VMCS entry
      # controls, which the pinned SEL4_SDK_VERSION above
      # (2.3.1-agentos-e60776ac-cr2, installed by install-sdk) provides, and
      # it needs NO guest blobs and NO nested VMX. So it runs here for real
      # and unconditionally: there is no skip branch, because there is
      # nothing to skip on. Verified against that exact SDK before this step
      # was added.
      #
      # What it does NOT do, stated so nobody reads more into a green tick:
      # it executes no guest, enters no VMX non-root mode and proves nothing
      # about EPT at run time. It proves this code still COMPILES AND LINKS
      # as one composition. The step below it is the boot proof; neither is
      # the guest proof, which cannot run on any runner here (see the gate
      # summary at the end of this job and docs/TCB.md).
      - name: GATE — make test-x86-firmware-build (VMX/EPT VMM links)
        timeout-minutes: 15
        run: make test-x86-firmware-build

      # The CC authority-envelope proof. Added here rather than relying on
      # `make gate`, which no CI job invokes -- the gate target's prerequisite
      # list is not what runs on push, so a proof reachable only through it
      # would never execute.
      - name: GATE — make test-cc-envelope
        timeout-minutes: 10
        run: make test-cc-envelope
      # Boot authority page: published counts vs. compiled descriptor, plus a
      # target fault probe that a consumer write to the read-only page faults.
      - name: GATE — make test-authority
        timeout-minutes: 10
        run: make test-authority

      # T3 image verification target proof: control boot, a byte-tampered PD
      # image refusing to boot (named), and a zeroed boot manifest refusing
      # to boot. See docs/superpowers/plans/2026-10-03-t3-image-verification.md
      # and docs/TCB.md.
      - name: GATE — make test-image-verify
        timeout-minutes: 15
        run: make test-image-verify

      # T10 trust anchor tiers target proof: verification runs under a named
      # anchor, the anchor decides whether a mismatch stops boot, a gating
      # tier with no key refuses rather than downgrading, and a running
      # system reports the tier its image was built with. The development
      # probe asserts BOTH the digest mismatch and the completed boot — see
      # the target's comment in the Makefile for why either alone is
      # worthless. Listed here explicitly as well as in `gate:` because no CI
      # job invokes `make gate`.
      #
      # This target now runs all five probes on aarch64, x86_64 AND riscv64
      # — three times the boots it used to do, plus a control boot inside
      # each architecture's probe 4, hence the raised timeout. riscv64
      # loud-skips if the installed SDK lacks the board; install-sdk provides
      # this run's own sdk-candidate artifact, which carries it, so the skip
      # should not fire here. If it does, the Makefile prints a NOT RUN
      # banner rather than passing quietly.
      - name: GATE — make test-trust-anchor (aarch64 + x86_64 + riscv64)
        timeout-minutes: 60
        run: make test-trust-anchor
      # entropy_pd reachability and safe degradation. NOT a working-entropy
      # proof: QEMU virt's virtio-mmio aperture is fully subscribed before
      # entropy_pd exists (docs/TCB.md), so no device is ever attached here.
      # This only proves the service answers, reports
      # AOS_ENTROPY_ERR_UNAVAILABLE rather than hanging/faulting/fabricating
      # bytes, and validates an over-length request with
      # AOS_ENTROPY_ERR_RANGE.
      - name: GATE — make test-entropy-unavailable
        timeout-minutes: 10
        run: make test-entropy-unavailable
      # T5 capability lending: the borrower uses the loan, the lender's
      # revoke faults the borrower's next access, and a capability the
      # borrower sub-delegated before revocation dies too. Added here
      # rather than relying on `make gate`, which no CI job invokes.
      - name: GATE — make test-cap-lending
        timeout-minutes: 10
        run: make test-cap-lending
      # T6 run-time child domain creation: a PD creates a child domain and
      # endows it from its own authority. The child uses what it was given
      # (exact pattern plus a physical address the parent independently
      # confirms), faults on a page the parent withheld (verified by the
      # root task's own fault oracle: exact badge, address, direction), does
      # not start at all when an endowment fails, and appears in the
      # authority report with the endowed kinds. Added here rather than
      # relying on `make gate`, which no CI job invokes -- this is the ONLY
      # job that builds the CHILD_SPAWN_TEST image at all, so without it the
      # entire spawn path (mint loop, teardown unmap, cache maintenance)
      # would rest on one manual boot.
      - name: GATE — make test-child-spawn
        timeout-minutes: 10
        run: make test-child-spawn
      # fault_handler liveness and a usable fault ring. This PD has no service
      # endpoint and no device, so nothing else in this job moves if it never
      # starts -- and it never started, on any architecture, for the whole life
      # of the file: `fault_ring_vaddr` was a .bss global nothing in the tree
      # assigned, so the PD stored its ring header through NULL on entry while
      # every gate above still passed. Added here explicitly as well as in
      # `gate:` because no CI job invokes `make gate`.
      - name: GATE — make test-fault-handler
        timeout-minutes: 10
        run: make test-fault-handler

      # TARGET/QEMU test #3 — riscv64. Boots qemu_virt_riscv64 GUEST_OS=none
      # and requires the signed PD manifest to verify and EVERY PD in
      # src/system_desc_riscv64.c to start (exact count, not a marker).
      #
      # This step RUNS FOR REAL. install-sdk installs the sdk-candidate
      # artifact THIS workflow run just built, and tools/sdk/candidate.mk now
      # lists qemu_virt_riscv64, so that SDK carries the board. riscv64 boots
      # here alongside aarch64 and x86_64 and a broken riscv64 fails this job.
      #
      # The guard below is kept, not vestigial: if this job is ever handed an
      # SDK without the board -- a hand-set SEL4_SDK, a changed install path,
      # the board dropped from candidate.mk -- it skips LOUDLY, with a GitHub
      # warning annotation and a NOT RUN line in the summary, rather than
      # silently reporting a pass it did not earn. The condition tests the
      # SDK's contents; it never looks at the test's result.
      #
      # The same guard still fires for a developer, because `make sdk` fetches
      # the PUBLISHED release asset, which predates the board. That closes
      # when the sdk-candidate artifact is republished.
      #
      # riscv64 compile-and-link is covered separately and unconditionally by
      # the riscv64-root-task-build job below, which builds the pinned riscv64
      # board from source itself.
      - name: GATE — make test-riscv64 (exact PD count)
        timeout-minutes: 15
        run: |
          set -euo pipefail
          sdk="${SEL4_SDK:-$HOME/.cache/agentos/microkit-sdk-$(cat tools/sdk/default-version)}"
          if [ ! -d "$sdk/board/qemu_virt_riscv64" ]; then
            echo "::warning title=riscv64 boot gate not run::The installed Microkit" \
                 "SDK ($sdk) has no qemu_virt_riscv64 board, so make test-riscv64" \
                 "cannot build. This is unexpected: tools/sdk/candidate.mk lists the" \
                 "board and install-sdk installs this run's own artifact, so the" \
                 "board should be present -- check whether it was dropped from" \
                 "candidate.mk or whether SEL4_SDK points somewhere else. riscv64" \
                 "BOOT is NOT proven by this run. riscv64 BUILD is, by the" \
                 "riscv64-root-task-build job."
            echo "riscv64=not-run" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "riscv64=run" >> "$GITHUB_ENV"
          make test-riscv64

      - name: Boot gate summary
        run: |
          echo "✅ Dual-arch boot gate passed:"
          echo "   - aarch64 GUEST_OS=none (target/QEMU)"
          echo "   - x86_64  GUEST_OS=none (target/QEMU, exact PD count)"
          if [ "${riscv64:-not-run}" = "run" ]; then
            echo "   - riscv64 GUEST_OS=none (target/QEMU, exact PD count)"
          else
            echo "   - riscv64: NOT RUN (installed SDK has no qemu_virt_riscv64"
            echo "     board, which is unexpected here -- see the warning above)."
            echo "     Nothing in THIS job proves anything about riscv64 booting."
            echo "     The riscv64-root-task-build job does prove riscv64 still"
            echo "     compiles and links."
          fi
          echo "   - CC operator authority envelope (admit / refuse / exact code)"
          echo "   - PD image verification (control / tampered-PD refusal / stripped-manifest refusal)"
          echo "   - T10 trust anchor tiers, ON ALL THREE ARCHITECTURES"
          echo "     (aarch64, x86_64, riscv64): vendor gates a tampered PD,"
          echo "     development reports the same mismatch and boots anyway,"
          echo "     a key-less gating tier is refused, and a machine-owner"
          echo "     build reports machine-owner. Two caveats, both measured:"
          echo "     * the key-less case prints a POSITIVE refusal on x86_64"
          echo "       (COM1 is live at Step 0a) but is an ABSENCE assertion"
          echo "       against its own control on aarch64/riscv64, whose"
          echo "       UARTs are not mapped until Step 3.5."
          echo "     * the machine-owner case reads the INSPECT SNAPSHOT only"
          echo "       on aarch64; x86_64 and riscv64 have no cc_pd in their"
          echo "       PD sets, so there they assert the boot banner only."
          echo "   - entropy_pd reachable; reports UNAVAILABLE (no device wired"
          echo "     on QEMU virt) and validates over-length requests"
          echo "   - T5 capability lending (loan used, revoked, sub-delegate dies too)"
          echo "   - T6 hierarchical delegation (child uses its endowment, faults on a"
          echo "     withheld page, never starts when an endowment fails, delegator reports it)"
          echo "   - fault_handler alive with a usable fault ring (round-trips its"
          echo "     ring at offset 0, at the last entry slot and at the final byte)"
          echo "GUEST_OS=none is a stub VMM: this proves PD load and root-task"
          echo "parking only. Guest I/O is proven by the guest proof jobs; the"
          echo "os-claim-summary job combines them."
          echo ""
          echo "x86_64 GUEST SUPPORT — what this run does and does not cover."
          echo "   COVERED, by make test-x86-firmware-build above: the VMX/EPT"
          echo "   firmware VMM, its MMIO dispatcher, the shared virtio-pci"
          echo "   transport and the drivers/virtualizers it composes with all"
          echo "   still COMPILE AND LINK against the pinned SDK. That is a"
          echo "   build check. It runs no guest and enters no VMX non-root"
          echo "   mode."
          echo "   NOT COVERED, here or in any workflow in this repository:"
          echo "   x86_64 guest EXECUTION."
          echo "   agentOS has a working non-libvmm VMX/EPT firmware VMM on the"
          echo "   x86_64_generic_vtx board that boots Debian amd64 to login and"
          echo "   SSH (make gate-x86_64-vtx / -firmware-reset / -linux-login)."
          echo "   None of THAT runs here. It needs a Linux host exposing /dev/kvm"
          echo "   with nested Intel VMX (kvm_intel nested=1), Microkit SDK 2.3.x"
          echo "   for the VMCS entry controls, and for -linux-login a disposable"
          echo "   raw Debian amd64 root disk in X86_ROOT_DISK. The guest proof"
          echo "   jobs above are AArch64. x86_64 guest claims rest on recorded"
          echo "   receipts, not on this run -- see docs/TCB.md."

  # ---------------------------------------------------------------------------
  # OS-claim summary — the only job whose success means "OS-level completion
  # claims are permitted".  It requires the dual-arch boot gate AND every
  # guest I/O proof through the virtualizer path (net, blk, console).
  # ---------------------------------------------------------------------------
  os-claim-summary:
    name: OS-claim gate (boot + guest net/blk/console proofs)
    runs-on: ubuntu-latest
    needs: [os-claim-gate, guest-net-proof, guest-blk-proof, ubuntu-agentos-virtio-proof, native-rust-proof]
    steps:
      - name: Summary
        run: |
          echo "✅ OS-claim gate passed:"
          echo "   - aarch64 + x86_64 boot (GUEST_OS=none)"
          echo "   - buildroot guest packet through emulated virtio-net"
          echo "   - buildroot guest request through emulated virtio-blk"
          echo "   - Ubuntu initramfs net + blk + console through agentOS VirtIO"
          echo "   - native Rust PD boot and checked seL4 IPC"
          echo "OS-level completion claims are permitted for this commit."

  # ---------------------------------------------------------------------------
  # riscv64 root-task build — the backstop that stops riscv64 rotting again.
  #
  # riscv64 was broken for an unknown length of time by a single duplicate
  # `case` label in ut_alloc.c, correct on aarch64 and a hard error on RISC-V,
  # and nobody noticed because NOTHING IN CI EVER COMPILED IT. This job exists
  # to make that impossible. It is not a syntax check and not a `make -n`: it
  # compiles every riscv64 PD and LINKS root_task.elf, then asserts the linked
  # artifact is a RISC-V ELF with real content. If riscv64 stops building, this
  # job goes red.
  #
  # It builds its own seL4/Microkit riscv64 board rather than using the
  # install-sdk artifact, because the published SDK artifact carries no
  # qemu_virt_riscv64 board until the sdk-candidate pipeline (now extended with
  # that board) has been re-run and re-published. Same pinned commits, same
  # single tools/sdk/patches/ patch, same discipline as tools/sdk/candidate.mk
  # — nothing forked, and nothing written into tools/sdk/. Kernel-hash
  # qualification stays where it belongs, in the sdk-candidate job; this job's
  # subject is OUR code's buildability, not the kernel's provenance.
  #
  # Does NOT boot anything. The riscv64 boot-and-PD-count proof is
  # `make test-riscv64`, run by the os-claim-gate job once the installed SDK
  # carries the board.
  # ---------------------------------------------------------------------------
  riscv64-root-task-build:
    name: riscv64 root task builds (compile + link root_task.elf)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Must match tools/sdk/candidate.mk. The step below fails the job if
      # they ever drift, so this duplication cannot go stale silently.
      MICROKIT_COMMIT: ec86afdcd662b5976d11d4994acf1b11a2979882
      SEL4_COMMIT: e60776acc31097ca063806c257f07a3ec05eacf8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pins match tools/sdk/candidate.mk
        run: |
          set -euo pipefail
          grep -q "$MICROKIT_COMMIT" tools/sdk/candidate.mk \
            || { echo "MICROKIT_COMMIT does not appear in tools/sdk/candidate.mk"; exit 1; }
          grep -q "$SEL4_COMMIT" tools/sdk/candidate.mk \
            || { echo "SEL4_COMMIT does not appear in tools/sdk/candidate.mk"; exit 1; }
          grep -q 'qemu_virt_riscv64' tools/sdk/candidate.mk \
            || { echo "tools/sdk/candidate.mk no longer lists qemu_virt_riscv64"; exit 1; }
          sdk_version="$(sed -n 's/^SDK_CANDIDATE_VERSION := //p' tools/sdk/candidate.mk)"
          test -n "$sdk_version" || { echo "could not read SDK_CANDIDATE_VERSION"; exit 1; }
          # Deliberately NOT the candidate version string. The kernel built
          # below comes from the same pinned commits and the same patch, but
          # it is a one-board, in-job build and is not the qualified published
          # artifact. Naming it the candidate version would make `make build`
          # run tools/sdk/candidate.mk's sdk-candidate-check against it, whose
          # cr2-kernels.sha256 manifest covers boards this one-board SDK does
          # not contain -- and would quietly imply this job re-qualifies the
          # pinned kernel. It does not. Kernel qualification is the
          # sdk-candidate workflow's job; this job's subject is whether OUR
          # riscv64 code compiles and links.
          echo "SDK_VERSION=${sdk_version}-riscv64-ci" >> "$GITHUB_ENV"

      - name: Install toolchains
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build python3-venv libxml2-utils \
            gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf \
            clang lld llvm device-tree-compiler qemu-system-misc curl
          python3 -m venv "$RUNNER_TEMP/sdk-venv"
          "$RUNNER_TEMP/sdk-venv/bin/pip" install -r tools/sdk/python-requirements.txt

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> _build/cargo"

      - name: Build the pinned seL4 riscv64 board
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/microkit-source"
          git -C "$RUNNER_TEMP/microkit-source" fetch -q --depth=1 \
            https://github.com/seL4/microkit.git "$MICROKIT_COMMIT"
          git -C "$RUNNER_TEMP/microkit-source" checkout -q --detach FETCH_HEAD
          git init -q "$RUNNER_TEMP/sel4-source"
          git -C "$RUNNER_TEMP/sel4-source" fetch -q --depth=1 \
            https://github.com/seL4/seL4.git "$SEL4_COMMIT"
          git -C "$RUNNER_TEMP/sel4-source" checkout -q --detach FETCH_HEAD
          git -C "$RUNNER_TEMP/sel4-source" apply \
            "$GITHUB_WORKSPACE/tools/sdk/patches/sel4-e60776ac-cr2.patch"
          cache="$RUNNER_TEMP/microkit-source/build/qemu_virt_riscv64/release/sel4/build"
          mkdir -p "$cache"
          printf '%s\n' 'KernelVerificationBuild:BOOL=OFF' 'KernelDebugBuild:BOOL=OFF' \
            'KernelPrinting:BOOL=OFF' 'KernelIRQReporting:BOOL=OFF' \
            'KernelColourPrinting:BOOL=OFF' > "$cache/CMakeCache.txt"
          cd "$RUNNER_TEMP/microkit-source"
          "$RUNNER_TEMP/sdk-venv/bin/python" build_sdk.py \
            --sel4 "$RUNNER_TEMP/sel4-source" \
            --boards qemu_virt_riscv64 --configs release \
            --skip-tool --skip-initialiser --skip-docs --skip-tar \
            --version "$SDK_VERSION"
          sdk="$RUNNER_TEMP/microkit-source/release/microkit-sdk-$SDK_VERSION"
          test -s "$sdk/board/qemu_virt_riscv64/release/elf/sel4.elf"
          echo "SEL4_SDK=$sdk" >> "$GITHUB_ENV"

      - name: Build the riscv64 root task
        run: |
          set -euo pipefail
          make build BOARD=qemu_virt_riscv64 GUEST_OS=none \
            SEL4_SDK="$SEL4_SDK" SEL4_SDK_VERSION="$SDK_VERSION"

      - name: Assert root_task.elf was actually linked
        run: |
          set -euo pipefail
          elf=_build/qemu_virt_riscv64/root_task.elf
          test -s "$elf" || { echo "FAIL: $elf was not produced"; exit 1; }
          riscv64-unknown-elf-readelf -h "$elf"
          riscv64-unknown-elf-readelf -h "$elf" | grep -q 'Machine: *RISC-V' \
            || { echo "FAIL: $elf is not a RISC-V ELF"; exit 1; }
          riscv64-unknown-elf-readelf -h "$elf" | grep -q 'Type: *EXEC' \
            || { echo "FAIL: $elf is not a linked executable"; exit 1; }
          # Guard against a link that "succeeded" over nothing: require the
          # root task's own entry point and main to be defined in the image.
          riscv64-unknown-elf-nm "$elf" > "$RUNNER_TEMP/rt.syms"
          grep -qE '^[0-9a-f]+ [Tt] _start$' "$RUNNER_TEMP/rt.syms" \
            || { echo "FAIL: _start is not defined in $elf"; exit 1; }
          grep -qE '^[0-9a-f]+ [Tt] root_task_main$' "$RUNNER_TEMP/rt.syms" \
            || { echo "FAIL: root_task_main is not defined in $elf"; exit 1; }
          # The embedded signed PD bundle must be present too, or riscv64 has
          # linked a root task that can spawn nothing (see docs/TCB.md).
          grep -qE '[0-9a-f]+ . __pd_bundle_start$' "$RUNNER_TEMP/rt.syms" \
            || { echo "FAIL: no embedded PD bundle in $elf"; exit 1; }
          test -s _build/qemu_virt_riscv64/agentos.img \
            || { echo "FAIL: agentos.img was not produced"; exit 1; }
          echo "OK: riscv64 root_task.elf linked ($(stat -c %s "$elf") bytes), bundle embedded"

  # ── Track P: HURD-parity service CI jobs ────────────────────────────────

  # NOTE: this job had a `strategy.matrix.board` of
  # [qemu_virt_aarch64, qemu_virt_riscv64] and never referenced
  # `matrix.board` anywhere: both legs ran `clang -fsyntax-only` on host
  # headers and `make -n ... ARCH=aarch64`. It therefore ran the identical
  # aarch64 work twice while displaying a job named "...(qemu_virt_riscv64)"
  # in the checks list. It was the only `riscv` string under .github/ and it
  # proved nothing about riscv64 -- decorative coverage, which is worse than
  # no coverage because it answers the question "is riscv64 built in CI?"
  # with a lie. The matrix is gone. Real riscv64 coverage is the
  # riscv64-root-task-build job above, which compiles and links the actual
  # root_task.elf.
  hurd-services-build:
    name: HURD services build (all new kernel PDs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cross-compile toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y clang lld

      - name: Compile HURD service PDs
        run: |
          cd kernel/agentos-root-task
          # Compile each new PD source file to verify no syntax errors
          for src in src/pflocal_server.c src/exec_server.c src/term_server.c \
                     src/auth_server.c src/proc_server.c src/vm_manager.c \
                     src/vm_snapshot.c src/ext2fs.c; do
            echo "Checking $src ..."
            clang -fsyntax-only -std=c11 \
              -DAGENTOS_TEST_HOST=1 \
              -I include \
              "$src" && echo "  OK: $src"
          done
          echo "All HURD PD sources compile cleanly."

      - name: Dry-run Makefile syntax check
        run: |
          make -n -C kernel/agentos-root-task \
            ARCH=aarch64 \
            MICROKIT_SDK=/opt/microkit \
            MICROKIT_BOARD=qemu_virt_aarch64 \
            MICROKIT_CONFIG=debug \
            || true

      - name: Verify HURD service source files exist
        run: |
          rc=0
          for f in \
            services/legacy-pds/auth_server.c services/legacy-pds/proc_server.c \
            services/legacy-pds/pflocal_server.c services/legacy-pds/exec_server.c \
            services/legacy-pds/term_server.c services/vm-manager/vm_manager.c \
            services/legacy-pds/vm_snapshot.c services/legacy-pds/ext2fs.c \
            services/net-service/lwip_sys.c services/net-service/lwip_shim.c \
            libs/pd-support/monocypher.c; do
            if test -f "$f"; then
              echo "✓ $f"
            else
              echo "✗ $f MISSING"
              rc=1
            fi
          done
          exit $rc

  proc-server-tests:
    name: proc_server unit tests (host-side)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check test_proc_server.c exists and is non-trivial
        run: |
          f=tests/test_proc_server.c
          test -f "$f" || { echo "MISSING: $f"; exit 1; }
          lines=$(wc -l < "$f")
          echo "test_proc_server.c: $lines lines"
          [ "$lines" -gt 50 ] || { echo "WARN: $f is only $lines lines"; }
          echo "✓ test_proc_server.c exists ($lines lines)"

      - name: Build and run proc_server tests
        run: |
          mkdir -p "$GITHUB_WORKSPACE/_build/tmp"
          cd kernel/agentos-root-task
          if [ -f tests/test_proc_server.c ]; then
            cc -std=c11 -Wall -DAGENTOS_TEST_HOST=1 -I include \
               tests/test_proc_server.c src/proc_server.c \
               -o "$GITHUB_WORKSPACE/_build/tmp/test_proc_server"
            "$GITHUB_WORKSPACE/_build/tmp/test_proc_server"
            echo "proc_server tests PASSED"
          else
            f=tests/test_proc_server.c
            if grep -q 'int main' "$f" 2>/dev/null; then
              cc -o "$GITHUB_WORKSPACE/_build/tmp/test_proc_server" "$f" \
                -I kernel/agentos-root-task/include \
                -DAGENTOS_HOST_TEST \
                && "$GITHUB_WORKSPACE/_build/tmp/test_proc_server" \
                && echo "✓ proc_server tests passed" \
                || echo "WARN: proc_server test compile/run failed (may need target headers)"
            else
              echo "No host-side proc_server tests found — skipping"
            fi
          fi

  rust-workspace-tests:
    name: Rust workspace tests (all crates, std features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install guest image and native helper tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y qemu-utils clang lld llvm
          qemu-img --version
          llvm-objcopy --version

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> _build/cargo"

      - name: Update Rust toolchain
        run: rustup update stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            _build/cargo
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run workspace tests
        run: |
          mkdir -p _build/tmp
          cargo test --workspace --features std 2>&1 | tee _build/tmp/test_output.txt
          if grep -q "FAILED" _build/tmp/test_output.txt; then
            echo "One or more Rust tests FAILED"
            exit 1
          fi
          echo "All Rust tests PASSED"

  tcp-smoke-check:
    name: TCP/IP smoke check (lwIP net_server boot message)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check lwipopts.h contains required defines
        run: |
          f=kernel/agentos-root-task/include/lwipopts.h
          test -f "$f" || { echo "MISSING: $f"; exit 1; }
          grep -q 'NO_SYS'  "$f" || { echo "FAIL: NO_SYS not found in $f";  exit 1; }
          grep -q 'MEM_SIZE' "$f" || { echo "FAIL: MEM_SIZE not found in $f"; exit 1; }
          echo "✓ lwipopts.h contains NO_SYS and MEM_SIZE"

      - name: Check lwip_sys.c is non-trivial (> 100 lines)
        run: |
          f=services/net-service/lwip_sys.c
          test -f "$f" || { echo "MISSING: $f"; exit 1; }
          lines=$(wc -l < "$f")
          echo "lwip_sys.c: $lines lines"
          [ "$lines" -gt 100 ] || { echo "FAIL: $f is only $lines lines (expected > 100)"; exit 1; }
          echo "✓ lwip_sys.c has $lines lines"

      - name: Check for lwIP init message in net_server
        run: |
          f=services/net-server/net_server.c
          test -f "$f" || { echo "MISSING: $f"; exit 1; }
          if grep -q "SMOLTCP_INTEGRATION_POINT" "$f"; then
            echo "FAIL: $f still has unimplemented SMOLTCP_INTEGRATION_POINT markers"
            exit 1
          fi
          if grep -q "lwIP\|lwip" "$f"; then
            echo "OK: $f has lwIP integration"
          else
            echo "FAIL: $f has no lwIP references"
            exit 1
          fi

  ed25519-smoke-check:
    name: Ed25519 smoke check (Monocypher field ops)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check monocypher.c exists and is non-trivial (> 500 lines)
        run: |
          f=libs/pd-support/monocypher.c
          test -f "$f" || { echo "MISSING: $f"; exit 1; }
          lines=$(wc -l < "$f")
          echo "monocypher.c: $lines lines"
          [ "$lines" -gt 500 ] || { echo "FAIL: $f is only $lines lines (expected > 500)"; exit 1; }
          echo "✓ monocypher.c has $lines lines"

      - name: Check ed25519_verify.c has no stubs
        run: |
          f=libs/pd-support/ed25519_verify.c
          test -f "$f" || { echo "MISSING: $f"; exit 1; }
          if grep -qiE '\bTODO\b|\bstub\b' "$f"; then
            echo "FAIL: $f still contains TODO or stub markers"
            grep -nE '\bTODO\b|\bstub\b' "$f" || true
            exit 1
          fi
          echo "✓ ed25519_verify.c has no TODO/stub markers"

      - name: Check monocypher.h exists
        run: |
          f=kernel/agentos-root-task/include/monocypher.h
          test -f "$f" || { echo "MISSING: $f"; exit 1; }
          echo "✓ monocypher.h exists"

      - name: Verify monocypher implementation present
        run: |
          if grep -q "crypto_ed25519_check\|fe25519_mul\|ge25519" libs/pd-support/monocypher.c; then
            echo "OK: Ed25519 field arithmetic found in monocypher.c"
          else
            echo "FAIL: expected Ed25519 functions not found in monocypher.c"
            exit 1
          fi

  vm-manager-check:
    name: vm_manager PD sanity check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check vm_manager.c exists
        run: |
          f=services/vm-manager/vm_manager.c
          test -f "$f" || { echo "MISSING: $f"; exit 1; }
          echo "✓ vm_manager.c exists"

      - name: Verify the shared profile-driven VMM
        run: |
          runtime=platform/guest-vmm/runtime.c
          vmm=platform/guest-vmm/guest_vmm.c
          legacy=kernel/freebsd-vmm/vmm_mux.c
          test -f "$runtime" || { echo "MISSING: $runtime"; exit 1; }
          test -f "$vmm" || { echo "MISSING: $vmm"; exit 1; }
          test ! -e "$legacy" || { echo "FAIL: legacy guest-specific VMM returned: $legacy"; exit 1; }
          grep -q 'aos_guest_vmm_runtime_t' "$runtime" || \
            { echo "FAIL: shared guest runtime contract missing"; exit 1; }
          echo "✓ shared profile-driven VMM exists; legacy guest-specific VMM is absent"

      - name: Verify vm_manager opcodes and agentos.system entry
        run: |
          # Check opcodes defined
          for op in OP_VM_CREATE OP_VM_DESTROY OP_VM_START OP_VM_STOP \
                    OP_VM_PAUSE OP_VM_RESUME OP_VM_LIST OP_VM_SNAPSHOT; do
            grep -q "$op" kernel/agentos-root-task/include/agentos.h || \
              { echo "FAIL: $op not defined in agentos.h"; exit 1; }
          done
          echo "OK: all VM manager opcodes defined"
          # Check vm_manager in agentos.system
          f=kernel/agentos-root-task/agentos.system
          test -f "$f" || f=agentos.system
          test -f "$f" || { echo "MISSING: agentos.system"; exit 1; }
          grep -q 'vm_manager' "$f" || { echo "FAIL: vm_manager not found in $f"; exit 1; }
          echo "OK: vm_manager in agentos.system"
          grep -q 'OP_VM_CREATE' kernel/agentos-root-task/include/agentos.h || \
            { echo "FAIL: OP_VM_CREATE not found in agentos.h"; exit 1; }
          echo "✓ agentos.h contains OP_VM_CREATE"

  # ---------------------------------------------------------------------------
  # E8-S4: Host-side TAP test suite — compile and run tests/api/ suites
  # Uses xtask test which compiles each suite with -DAGENTOS_TEST_HOST and
  # parses TAP output to determine pass/fail.
  # ---------------------------------------------------------------------------
  host-tests:
    name: Host-side TAP tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> _build/cargo"

      - name: Run xtask test
        run: cargo run --manifest-path xtask/Cargo.toml -- test

  # ---------------------------------------------------------------------------
  # E8-S4: xtask build check — verify the task runner itself compiles cleanly
  # ---------------------------------------------------------------------------
  rust-check:
    name: Rust xtask check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> _build/cargo"

      - name: cargo check xtask
        run: cargo check --manifest-path xtask/Cargo.toml
