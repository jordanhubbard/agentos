name: Dual guest SSH qualification

# Expensive live-media boots are explicit release qualifications. Do not add
# this workflow to push, pull_request, or scheduled events.
on:
  workflow_dispatch:
    inputs:
      guests:
        description: Guest pair to qualify through concurrent authenticated SSH
        required: true
        default: ubuntu-freebsd
        type: choice
        options:
          - ubuntu-freebsd
          - debian-freebsd

permissions:
  contents: read

# Keep one qualification active across all refs; never cancel retained work.
concurrency:
  group: dual-guest-qualification
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  SEL4_SDK_VERSION: 2.3.1-agentos-e60776ac-cr2
  SEL4_SDK: /tmp/microkit-sdk-2.3.1-agentos-e60776ac-cr2

defaults:
  run:
    shell: bash

jobs:
  sdk-candidate:
    uses: ./.github/workflows/sdk-candidate.yml
  dual-ssh:
    name: Functional SSH sessions (${{ inputs.guests }})
    runs-on: ubuntu-24.04
    needs: sdk-candidate
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install guest qualification tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential clang lld llvm qemu-system-arm qemu-utils \
            device-tree-compiler libarchive-tools e2fsprogs zstd curl openssh-client gnupg

      - name: Install pinned guest helper compiler
        run: |
          curl --fail --silent --show-error https://apt.llvm.org/llvm-snapshot.gpg.key -o /tmp/llvm-signing-key.asc
          fingerprint=$(gpg --show-keys --with-colons /tmp/llvm-signing-key.asc | awk -F: '$1 == "fpr" {print $10; exit}')
          test "$fingerprint" = 6084F3CF814B57C1CF12EFD515CF4D18AF4F7421
          gpg --dearmor < /tmp/llvm-signing-key.asc | sudo tee /usr/share/keyrings/llvm.gpg > /dev/null
          echo 'deb [signed-by=/usr/share/keyrings/llvm.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main' | sudo tee /etc/apt/sources.list.d/llvm21.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-21 lld-21 llvm-21
          # Guest helper artifact hashes are compiler-sensitive. Keep the
          # acquisition compiler independent of the kernel build's PATH.
          echo "AGENTOS_HOST_TOOL_PATH=/usr/lib/llvm-21/bin:$PATH" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-none
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> _build/cargo"

      - name: Install verified SDK artifact
        uses: ./.github/actions/install-sdk

      - name: Cache pinned guest media
        uses: actions/cache@v4
        with:
          path: ~/.cache/agentos/isos/
          key: dual-ssh-${{ runner.os }}-${{ inputs.guests }}-${{ hashFiles('guest-profiles/*.toml', 'xtask/src/guest_manifest.rs') }}

      - name: Prove functional SSH sessions and peer survival across recreation
        timeout-minutes: 300
        env:
          GUEST_PAIR: ${{ inputs.guests }}
        run: |
          case "$GUEST_PAIR" in
            ubuntu-freebsd) target=test-dual-guest-recreation ;;
            debian-freebsd) target=test-debian-peer-recreation ;;
            *) echo "Unsupported guest pair: $GUEST_PAIR" >&2; exit 1 ;;
          esac
          mkdir -p _build/evidence/dual-ssh
          git rev-parse HEAD > _build/evidence/dual-ssh/source-revision.txt
          # bash pipefail propagates the Make failure through tee. The existing
          # harness requires exact FreeBSD/Linux readiness replies, repeats
          # them after Linux recreation, then checks real terminal sessions
          # including file/process, network and package operations in both guests.
          make "$target" DUAL_OS_TEST_TIMEOUT=14400 2>&1 | tee _build/evidence/dual-ssh/qualification.log

      - name: Retain qualification and authenticated SSH transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dual-ssh-${{ inputs.guests }}-${{ github.sha }}
          path: |
            _build/evidence/dual-ssh/
            _build/evidence/guest-session-*/
            _build/tmp/agentos-qemu-*.log
            _build/tmp/agentos-qemu-*.qemu.stderr
            _build/tmp/agentos-qemu-*.ssh-evidence/
          if-no-files-found: error
